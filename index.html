<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Los Horizon</title>
    <meta
      name="description"
      content="An original open-world driving prototype inspired by cinematic city racing and pursuit gameplay."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div class="panel left">
        <div class="label">Speed</div>
        <div id="speed">0 km/h</div>
        <div class="label">Wanted</div>
        <div id="wanted">★☆☆☆☆</div>
      </div>

      <div class="panel center">
        <div id="status">CITY GRID</div>
      </div>

      <div class="panel right">
        <div class="label">Score</div>
        <div id="score">0</div>
        <div class="label">Multiplier</div>
        <div id="multiplier">x1.0</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
